<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registrations — Custody Chain</title>
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  (function () {
    const saved = localStorage.getItem("theme");
    const theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    --ink:      #0A0E16;
    --surface:  #131A26;
    --surface2: #1A2333;
    --line:     #263145;
    --text:     #EAEFF6;
    --muted:    #8A97AD;
    --accent:   #0A84FF;
    --secure:   #30D18A;
    --tamper:   #FF6961;
    --pending:  #E8B339;
    --header-bg: rgba(19, 26, 38, .72);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="light"] {
    --ink:      #F2F3F7;
    --surface:  #FFFFFF;
    --surface2: #F5F6F9;
    --line:     #E1E3E9;
    --text:     #1D1D1F;
    --muted:    #6E6E76;
    --accent:   #007AFF;
    --secure:   #12875A;
    --tamper:   #D6362B;
    --pending:  #A0680C;
    --header-bg: rgba(255, 255, 255, .72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--ink); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.47; letter-spacing: -0.006em;
    margin: 0 auto; max-width: 900px;
    transition: background .15s, color .15s;
  }
  main, header, .back { padding-left: clamp(16px, 4vw, 48px); padding-right: clamp(16px, 4vw, 48px); }
  .theme-toggle {
    font-size: 13px; font-weight: 590;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    height: 28px; padding: 0 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, background .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle svg { width: 14px; height: 14px; display: block; }
  header { position: sticky; top: 0; z-index: 10;
           display: flex; align-items: center; justify-content: space-between;
           flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line);
           padding-top: 16px; padding-bottom: 16px; margin-bottom: 12px;
           background: var(--header-bg); backdrop-filter: blur(20px) saturate(1.6);
           -webkit-backdrop-filter: blur(20px) saturate(1.6); }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .conn { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
          display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--secure); box-shadow: 0 0 0 3px rgba(48,209,138,.18); }
  .dot.mock { background: var(--pending); box-shadow: 0 0 0 3px rgba(232,179,57,.18); }
  main { display: block; padding-top: 12px; padding-bottom: 20px; }

  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
          color: var(--muted); text-decoration: none; margin-bottom: 18px; padding-top: 20px; }
  .back:hover { color: var(--text); }

  .toolbar { display: flex; justify-content: space-between; align-items: center;
             margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  button {
    font-family: var(--sans); font-size: 13px; font-weight: 590;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    height: 32px; padding: 0 14px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  button:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: color-mix(in srgb, var(--accent) 88%, #000); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; display: flex; gap: 14px; align-items: center;
    box-shadow: 0 4px 14px -10px rgba(0,0,0,.4);
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 12px; object-fit: cover;
    background: var(--surface2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); flex-shrink: 0;
  }
  .avatar svg { width: 22px; height: 22px; }
  .card-body { min-width: 0; }
  .card-name { font-size: 15.5px; font-weight: 650; margin-bottom: 4px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
               display: flex; flex-direction: column; gap: 2px; }

  .empty { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 40px 0;
           text-align: center; }

  .add-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 20px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .add-panel input {
    font-family: var(--sans); font-size: 14px; color: var(--text);
    background: var(--surface2); border: 1px solid var(--line); border-radius: 8px;
    height: 36px; padding: 0 12px; flex: 1 1 220px; min-width: 0;
  }
  .add-panel input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-panel button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .add-panel button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .add-panel button:disabled { opacity: .5; cursor: default; }

  .req-status { font-family: var(--mono); font-size: 12.5px; margin-top: 12px;
                display: flex; align-items: center; gap: 8px; }
  .req-status .spin { width: 12px; height: 12px; border-radius: 50%;
                       border: 2px solid var(--line); border-top-color: var(--pending);
                       animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .req-status.ok   { color: var(--secure); }
  .req-status.bad  { color: var(--tamper); }
  .req-status.wait { color: var(--pending); }

  .pin-gate {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .pin-icon { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
  .pin-input {
    font-family: var(--mono); font-size: 18px; letter-spacing: .3em;
    background: var(--surface2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; width: 90px; text-align: center;
  }
  .pin-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pin-error { font-family: var(--mono); font-size: 12px; color: var(--tamper); }
  .lock-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .lock-toolbar button { font-size: 12px; height: 28px; padding: 0 12px; }
</style>
</head>
<body>
  <header>
    <h1>User Registrations <span>/ Custody Chain</span></h1>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="conn"><span id="dot" class="dot"></span><span id="conn-text">connecting…</span></div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode"></button>
    </div>
  </header>

  <a class="back" href="index.html">← Back to Box Monitor</a>

  <main>
  <div id="panel-locked" class="pin-gate">
    <svg class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="4" placeholder="····" autocomplete="off" />
    <button class="primary" onclick="tryUnlock()">Unlock</button>
    <span class="pin-error" id="pin-error"></span>
  </div>

  <div id="panel-unlocked" style="display:none">
    <div class="lock-toolbar"><button onclick="lockPanel()">Hide again</button></div>

    <div class="add-panel">
      <input id="new-name" type="text" placeholder="Name to enroll (e.g. Nikhil)" maxlength="80" />
      <button class="primary" id="add-btn" onclick="requestEnrollment()">Add new user →</button>
    </div>
    <div id="req-status"></div>
    <button id="stop-btn" onclick="stopEnrollment()" style="display:none; margin-top:10px; border-color: var(--tamper); color: var(--tamper);">Stop enrollment</button>

    <div class="toolbar">
      <span id="count" style="font-family: var(--mono); font-size: 12px; color: var(--muted);"></span>
      <button onclick="load()">Refresh</button>
    </div>

    <div id="grid" class="grid"><div class="empty">Loading registrations…</div></div>
  </div>
  </main>

<script>
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"></path></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.9a8.5 8.5 0 1 1-9.3-12 7 7 0 0 0 9.3 12z"></path></svg>';
  function paintThemeButton() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    document.getElementById("theme-toggle").innerHTML = isLight
      ? `${MOON_ICON}Dark`
      : `${SUN_ICON}Light`;
  }
  function toggleTheme() {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    paintThemeButton();
  }
  paintThemeButton();

  const API = `http://saroops-macbook-air.tailb523e7.ts.net:3000`;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  const istFormatter = new Intl.DateTimeFormat("en-IN", {
    timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
  });
  function formatIST(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d)) return ts;
    return istFormatter.format(d) + " IST";
  }

  function setConn(live) {
    const dot = document.getElementById("dot"), t = document.getElementById("conn-text");
    dot.className = "dot " + (live ? "live" : "mock");
    t.textContent = live ? "live · backend connected" : "demo mode · backend offline";
  }

  async function load() {
    const grid = document.getElementById("grid");
    try {
      const res = await fetch(API + "/enrollments");
      if (!res.ok) throw new Error(res.status);
      const rows = await res.json();
      setConn(true);
      document.getElementById("count").textContent = `${rows.length} registered`;

      if (!rows.length) {
        grid.innerHTML = '<div class="empty">No users registered yet. Enroll one from the vault hardware.</div>';
        return;
      }

      grid.innerHTML = rows.map(r => {
        const hasFace = r.face_id && r.face_id !== "no_image_captured";
        const avatar = hasFace
          ? `<img class="avatar" src="data:image/jpeg;base64,${r.face_id}" alt="${escapeHtml(r.name)}" />`
          : `<div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M4.5 20c1.4-3.8 4.4-5.8 7.5-5.8s6.1 2 7.5 5.8"></path></svg></div>`;
        return `
        <div class="card">
          ${avatar}
          <div class="card-body">
            <div class="card-name">${escapeHtml(r.name)}</div>
            <div class="card-meta">
              <span>fingerprint slot ${escapeHtml(r.fingerprint_slot)}</span>
              <span>enrolled ${formatIST(r.enrolled_at)}</span>
              ${r.firmware_ver ? `<span>fw ${escapeHtml(r.firmware_ver)}</span>` : ""}
            </div>
          </div>
        </div>`;
      }).join("");
    } catch (e) {
      setConn(false);
      grid.innerHTML = '<div class="empty">Can\'t reach the backend right now.</div>';
    }
  }

  let statusPollTimer = null;
  let currentRequestId = null;

  function renderReqStatus(cls, html) {
    const el = document.getElementById("req-status");
    el.className = "req-status " + cls;
    el.innerHTML = html;
  }

  function showStopButton(show) {
    document.getElementById("stop-btn").style.display = show ? "inline-block" : "none";
  }

  async function requestEnrollment() {
    const input = document.getElementById("new-name");
    const btn = document.getElementById("add-btn");
    const name = input.value.trim();
    if (!name) { input.focus(); return; }

    btn.disabled = true;
    try {
      const res = await fetch(API + "/enrollment-requests", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) throw new Error(res.status);
      const request = await res.json();
      input.value = "";
      currentRequestId = request.id;
      renderReqStatus("wait", `<span class="spin"></span> Queued -- waiting for the Pi to enroll "${escapeHtml(name)}" (place finger + look at camera when it starts)…`);
      showStopButton(true);
      pollRequestStatus(request.id, name);
    } catch (e) {
      renderReqStatus("bad", `✗ Couldn't queue the request -- backend unreachable.`);
      btn.disabled = false;
    }
  }

  async function stopEnrollment() {
    if (!currentRequestId) return;
    showStopButton(false);
    try {
      await fetch(API + `/enrollment-requests/${currentRequestId}/cancel`, { method: "POST" });
      renderReqStatus("bad", `✗ Enrollment stopped.`);
    } catch (e) {
      renderReqStatus("bad", `✗ Couldn't reach the backend to stop it -- it may still be running.`);
    } finally {
      if (statusPollTimer) clearInterval(statusPollTimer);
      document.getElementById("add-btn").disabled = false;
      currentRequestId = null;
    }
  }

  function pollRequestStatus(id, name) {
    if (statusPollTimer) clearInterval(statusPollTimer);
    statusPollTimer = setInterval(async () => {
      try {
        const res = await fetch(API + "/enrollment-requests");
        if (!res.ok) throw new Error(res.status);
        const rows = await res.json();
        const req = rows.find(r => r.id === id);
        if (!req) return;

        if (req.status === "in_progress") {
          renderReqStatus("wait", `<span class="spin"></span> Enrolling "${escapeHtml(name)}" now -- follow the prompts on the vault's display…`);
        } else if (req.status === "done") {
          renderReqStatus("ok", `✓ "${escapeHtml(name)}" enrolled successfully.`);
          clearInterval(statusPollTimer);
          showStopButton(false);
          document.getElementById("add-btn").disabled = false;
          currentRequestId = null;
          load();
        } else if (req.status === "failed") {
          renderReqStatus("bad", `✗ Enrollment failed: ${escapeHtml(req.error || "unknown error")}`);
          clearInterval(statusPollTimer);
          showStopButton(false);
          document.getElementById("add-btn").disabled = false;
          currentRequestId = null;
        } else if (req.status === "cancelled") {
          clearInterval(statusPollTimer);
          showStopButton(false);
          document.getElementById("add-btn").disabled = false;
          currentRequestId = null;
        }
      } catch (e) {
        // transient network hiccup -- keep polling, don't give up on one failed check
      }
    }, 2000);
  }

  // Client-side speed bump for a casual glance at the screen, not real
  // access control -- anyone reading the page source sees it. Same PIN the
  // old "Authorized users" panel on the dashboard used to gate.
  const PANEL_PIN = "1290";
  let refreshTimer = null;

  function tryUnlock() {
    const input = document.getElementById("pin-input");
    const err = document.getElementById("pin-error");
    if (input.value === PANEL_PIN) {
      document.getElementById("panel-locked").style.display = "none";
      document.getElementById("panel-unlocked").style.display = "";
      input.value = "";
      err.textContent = "";
      load();
      if (!refreshTimer) refreshTimer = setInterval(load, 8000);
    } else {
      err.textContent = "Wrong PIN";
      input.value = "";
      input.focus();
    }
  }

  function lockPanel() {
    document.getElementById("panel-unlocked").style.display = "none";
    document.getElementById("panel-locked").style.display = "";
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("pin-input");
    if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
  });
</script>
</body>
</html>
