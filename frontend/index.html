<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti Tamper Vault</title>
<style>
  /* ---- design tokens -------------------------------------------------
     Direction: a forensic evidence-ledger console, not a SaaS dashboard.
     The signature element is the event timeline drawn as linked records —
     each one independently hash-verified against the DB and (when anchored)
     against the on-chain record. A verified record glows; a failed one
     turns red at exactly the record where verification failed.
     System fonts only, so it renders with no internet at the expo. */
  :root {
    --ink:      #0A0E16;   /* deep institutional navy, not pure black */
    --surface:  #131A26;
    --surface2: #1A2333;
    --line:     #263145;
    --text:     #EAEFF6;
    --muted:    #7C8CA6;
    --accent:   #4C8DFF;   /* professional blue — primary actions */
    --secure:   #2FB088;   /* integrity intact */
    --tamper:   #E5484D;   /* tamper detected / verification failed */
    --pending:  #D9A441;   /* off-chain / awaiting anchor */
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    padding: 28px clamp(16px, 4vw, 48px);
    max-width: 1000px;
    margin: 0 auto;
  }

  /* header */
  header { display: flex; align-items: baseline; justify-content: space-between;
           flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line);
           padding-bottom: 18px; margin-bottom: 26px; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .conn { font-family: var(--mono); font-size: 12px; color: var(--muted);
          display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--secure); box-shadow: 0 0 0 3px rgba(63,182,139,.18); }
  .dot.mock { background: var(--pending); box-shadow: 0 0 0 3px rgba(224,164,88,.18); }

  /* status card */
  .status {
    background: linear-gradient(180deg, var(--surface2), var(--surface));
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.5);
    padding: 24px 26px; margin-bottom: 26px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .status .box-id { font-family: var(--mono); color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  .status .state { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .state.secure  { color: var(--secure); }
  .state.tampered{ color: var(--tamper); }
  .seal { width: 58px; height: 58px; border-radius: 50%; border: 2px solid currentColor;
          display: grid; place-items: center; font-size: 24px; }
  .seal.secure  { color: var(--secure); }
  .seal.tampered{ color: var(--tamper); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* controls */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  button {
    font-family: var(--sans); font-size: 13.5px; font-weight: 550;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 16px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--secure); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .verdict { font-family: var(--mono); font-size: 13px; margin-bottom: 20px; min-height: 20px; }
  .verdict.ok   { color: var(--secure); }
  .verdict.bad  { color: var(--tamper); }

  /* ledger filter group */
  .filters { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters .flabel { font-family: var(--mono); font-size: 11px; text-transform: uppercase;
                      letter-spacing: .1em; color: var(--muted); margin-right: 2px; }
  .filter-btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 550;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* the event ledger — the signature element */
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
       color: var(--muted); margin-bottom: 14px; font-weight: 600; }
  .chain { list-style: none; position: relative; }
  .link {
    position: relative; background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--secure); border-radius: 12px;
    box-shadow: 0 4px 14px -10px rgba(0,0,0,.6);
    padding: 20px 22px; margin-bottom: 14px;
  }
  .link.tamper { border-left-color: var(--tamper); }
  .link.fail   { border-left-color: var(--tamper); }
  /* connector that visually threads one record to the next in time */
  .link:not(:last-child)::after {
    content: ""; position: absolute; left: 15px; bottom: -14px; height: 14px;
    width: 2px; background: var(--line);
  }
  .link-top { display: flex; justify-content: space-between; align-items: center; gap: 10px;
              margin-bottom: 4px; }
  .etype { font-weight: 600; font-size: 15.5px; }
  .etype .tag { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px;
                margin-left: 8px; vertical-align: middle; }
  .tag.tamper { background: rgba(229,72,77,.15); color: var(--tamper); }
  .tag.bump   { background: rgba(124,140,166,.15); color: var(--muted); }
  .tag.fail   { background: rgba(229,72,77,.15); color: var(--tamper); }
  .tag.ok     { background: rgba(47,176,136,.15); color: var(--secure); }
  .time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .hash-row { margin-top: 12px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .hash-block { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .hash-label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
                letter-spacing: .1em; color: var(--muted); }
  .hash-value { font-family: var(--mono); font-size: 12.5px; color: var(--text);
                word-break: break-all; background: var(--surface2); border: 1px solid var(--line);
                border-radius: 7px; padding: 8px 10px; }
  .anchor { font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 5px;
            white-space: nowrap; }
  .anchor.on_chain  { background: rgba(47,176,136,.15); color: var(--secure); }
  .anchor.off_chain { background: rgba(217,164,65,.15); color: var(--pending); }
  .anchor a { color: inherit; }

  .geo-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .geo-value { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .geo-badge { font-family: var(--mono); font-size: 10.5px; padding: 3px 8px; border-radius: 5px;
               text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .geo-badge.on_chain  { background: rgba(47,176,136,.15); color: var(--secure); }
  .geo-badge.off_chain { background: rgba(124,140,166,.15); color: var(--muted); }

  .tag.enroll { background: rgba(76,141,255,.15); color: var(--accent); }
  .enroll-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .enroll-value { font-family: var(--mono); font-size: 12.5px; color: var(--text); }

  /* authorized users -- deliberately plain, no hash/anchor noise */
  .users-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .user-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .user-name { font-size: 15px; font-weight: 600; }
  .user-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .pin-gate {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 26px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .pin-icon { font-size: 16px; }
  .pin-input {
    font-family: var(--mono); font-size: 18px; letter-spacing: .3em;
    background: var(--surface2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; width: 90px; text-align: center;
  }
  .pin-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pin-error { font-family: var(--mono); font-size: 12px; color: var(--tamper); }
  .users-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .users-toolbar button { font-size: 12px; padding: 6px 12px; }

  .empty { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 30px 0; }
  footer { margin-top: 34px; color: var(--muted); font-size: 12px; font-family: var(--mono);
           border-top: 1px solid var(--line); padding-top: 16px; }
  @media (prefers-reduced-motion: reduce) { .seal.tampered { animation: none; } }
</style>
</head>
<body>
  <header>
    <h1>Custody Chain <span>/ Box Monitor</span></h1>
    <div class="conn"><span id="dot" class="dot"></span><span id="conn-text">connecting…</span></div>
  </header>

  <section class="status" id="status">
    <div>
      <div class="box-id" id="box-id">BOX-001</div>
      <div class="state secure" id="state">SECURE</div>
    </div>
    <div class="seal secure" id="seal">✓</div>
  </section>

  <div class="controls">
    <button class="primary" onclick="verifyChain()">Verify integrity</button>
    <button onclick="refresh()">Refresh</button>
  </div>
  <div class="verdict" id="verdict"></div>

  <h2>Authorized users</h2>
  <div id="users-locked" class="pin-gate">
    <span class="pin-icon">🔒</span>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="4" placeholder="····" autocomplete="off" />
    <button class="primary" onclick="tryUnlockUsers()">Unlock</button>
    <span class="pin-error" id="pin-error"></span>
  </div>
  <div id="users-unlocked" style="display:none">
    <div class="users-toolbar"><button onclick="lockUsers()">🔒 Hide again</button></div>
    <div id="users" class="users-list"></div>
  </div>

  <h2>Event ledger — newest first</h2>
  <div class="filters" role="group" aria-label="Ledger filter">
    <span class="flabel">Filter</span>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Show all</button>
    <button class="filter-btn" data-filter="tamper" onclick="setFilter('tamper')">Show only tamper</button>
    <button class="filter-btn" data-filter="offchain" onclick="setFilter('offchain')">Show all off-chain</button>
  </div>
  <ul class="chain" id="chain"><li class="empty">Loading records…</li></ul>

  <footer id="foot">Reading from backend at <span id="api">http://localhost:3000</span></footer>

<script>
  // ---- config -------------------------------------------------------------
  // Same host this page was loaded from, port 3000 -- so it works whether
  // this is opened as localhost:8088 or from another device on the LAN via
  // e.g. 192.168.x.x:8088 (a hardcoded "localhost" would break for anyone
  // opening it from a different machine, since localhost means themselves).
  const API = `http://${window.location.hostname}:3000`;
  document.getElementById("api").textContent = API;

  // Gates the "Authorized users" panel. This is a client-side speed bump for
  // a casual glance at the screen, not real access control -- anyone reading
  // the page source sees it. Change it here.
  const USERS_PIN = "1290";
  let usersUnlocked = false;
  let lastUsersRecords = [];

  let mockMode = false;
  const mockChain = [];                     // used only if backend is unreachable

  // ---- backend calls with graceful fallback to mock mode ------------------
  async function api(path, opts) {
    const res = await fetch(API + path, opts);
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  async function refresh() {
    try {
      const rows = await api("/events");
      mockMode = false;
      setConn(true);
      const records = normalise(rows);
      renderChain(records);
      renderUsers(records);
      renderStatus(records.length && records[0].tamper ? "TAMPERED" : "SECURE");
      if (records.length) document.getElementById("box-id").textContent = records[0].device_id;
    } catch (e) {
      mockMode = true;
      setConn(false);
      renderChain(mockChain);
      renderUsers(mockChain);
      renderStatus(mockChain.some(r => r.tamper) ? "TAMPERED" : "SECURE");
    }
  }

  // Authorized-users panel -- just who's enrolled, no hash/anchor clutter,
  // and hidden behind USERS_PIN until unlocked. records are newest-first
  // already, so the first occurrence of a username is its most recent
  // enrollment (re-enrolling updates the slot shown).
  function renderUsers(records) {
    lastUsersRecords = records;
    if (usersUnlocked) paintUsers(records);
  }

  function paintUsers(records) {
    const el = document.getElementById("users");
    const seen = new Map();
    for (const r of records) {
      if (r.enrolledUser && !seen.has(r.enrolledUser)) {
        seen.set(r.enrolledUser, { slot: r.biometricSlot, when: r.timestamp });
      }
    }
    if (seen.size === 0) {
      el.innerHTML = '<div class="empty">No users enrolled yet.</div>';
      return;
    }
    el.innerHTML = [...seen.entries()].map(([name, info]) => `
      <div class="user-card">
        <span class="user-name">${escapeHtml(name)}</span>
        <span class="user-meta">${info.slot != null ? `fingerprint slot ${escapeHtml(info.slot)} &middot; ` : ""}enrolled ${formatIST(info.when)}</span>
      </div>`).join("");
  }

  function tryUnlockUsers() {
    const input = document.getElementById("pin-input");
    const err = document.getElementById("pin-error");
    if (input.value === USERS_PIN) {
      usersUnlocked = true;
      document.getElementById("users-locked").style.display = "none";
      document.getElementById("users-unlocked").style.display = "";
      input.value = "";
      err.textContent = "";
      paintUsers(lastUsersRecords);
    } else {
      err.textContent = "Wrong PIN";
      input.value = "";
      input.focus();
    }
  }

  function lockUsers() {
    usersUnlocked = false;
    document.getElementById("users-unlocked").style.display = "none";
    document.getElementById("users-locked").style.display = "";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("pin-input");
    if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlockUsers(); });
  });

  // backend (GET /events) returns DB rows newest-first already
  function normalise(rows) {
    return rows.map(r => ({
      id:          r.id,
      device_id:   r.device_id,
      event_type:  r.status,
      timestamp:   r.device_ts,
      hash:        r.data_hash,
      onchain_tx:  r.onchain_tx,
      anchor:      r.onchain_tx ? "on_chain" : "off_chain",
      tamper:      !!r.tamper,
      lat:         r.lat,
      lng:         r.lng,
      locationOnChain: !!r.location_onchain,
      enrolledUser: r.status === "user_registered" ? (r.sensor_data && r.sensor_data.enrolled_user) : null,
      biometricSlot: r.status === "user_registered" ? (r.sensor_data && r.sensor_data.biometric_slot) : null,
    }));
  }

  function setConn(live) {
    const dot = document.getElementById("dot"), t = document.getElementById("conn-text");
    dot.className = "dot " + (live ? "live" : "mock");
    t.textContent = live ? "live · backend connected" : "demo mode · backend offline";
  }

  // enrolled_user (and other free-text sensor_data fields) come straight from
  // whatever posts to /events -- escape before dropping into innerHTML so a
  // crafted username/device can't inject markup into the dashboard.
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function renderStatus(state) {
    const secure = state !== "TAMPERED";
    const stateEl = document.getElementById("state"), seal = document.getElementById("seal");
    stateEl.textContent = secure ? "SECURE" : "TAMPERED";
    stateEl.className = "state " + (secure ? "secure" : "tampered");
    seal.textContent = secure ? "✓" : "!";
    seal.className = "seal " + (secure ? "secure" : "tampered");
  }

  // full hash is always shown in the ledger — nothing truncated
  function fullHash(h) { return h || "—"; }

  // display-only: server stores/hashes timestamps in UTC, we just render them in IST here
  const istFormatter = new Intl.DateTimeFormat("en-IN", {
    timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
  });
  function formatIST(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d)) return ts;
    return istFormatter.format(d) + " IST";
  }

  // verifyResults: Map<id, {dbMatch, chainMatch}> from the last "Verify integrity" run
  let verifyResults = new Map();

  // filterMode: "all" | "tamper" | "offchain" — controls the ledger filter pills
  let filterMode = "all";
  let lastRecords = [];

  function setFilter(mode) {
    filterMode = mode;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === mode));
    renderChain(lastRecords);
  }

  function applyFilter(records) {
    if (filterMode === "tamper") return records.filter(r => r.tamper);
    if (filterMode === "offchain") return records.filter(r => r.anchor === "off_chain");
    return records;
  }

  function renderChain(records) {
    lastRecords = records;
    const ul = document.getElementById("chain");
    if (!records.length) { ul.innerHTML = '<li class="empty">No events yet. Trigger one to see the ledger build.</li>'; return; }
    const filtered = applyFilter(records);
    if (!filtered.length) {
      const msg = filterMode === "tamper" ? "No tamper events match this filter."
                : filterMode === "offchain" ? "No off-chain records match this filter."
                : "No events yet. Trigger one to see the ledger build.";
      ul.innerHTML = `<li class="empty">${msg}</li>`;
      return;
    }
    ul.innerHTML = filtered.map(r => {
      const anchorLabel = r.anchor === "on_chain"
        ? (r.onchain_tx ? `<a href="https://sepolia.etherscan.io/tx/${r.onchain_tx}" target="_blank">on-chain ↗</a>` : "on-chain")
        : "off-chain";
      const v = verifyResults.get(r.id);
      const failed = v && (v.dbMatch === false || v.chainMatch === false);
      const checked = v && !failed;

      // lat/lng land in the Vault contract's own storage only for anchored
      // (tamper) events -- everything else has them off-chain in Postgres only.
      const hasGeo = r.lat !== null && r.lat !== undefined && r.lng !== null && r.lng !== undefined;
      const geoOnChain = hasGeo && r.locationOnChain;
      const geoRow = hasGeo ? `
        <div class="geo-row">
          <span class="hash-label">Location</span>
          <span class="geo-value">${Number(r.lat).toFixed(6)}, ${Number(r.lng).toFixed(6)}</span>
          <a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">map ↗</a>
          <span class="geo-badge ${geoOnChain ? "on_chain" : "off_chain"}">${geoOnChain ? "on-chain" : "off-chain only"}</span>
        </div>` : "";

      // who got enrolled is deliberately NOT shown here -- see the PIN-gated
      // "Authorized users" panel instead. The ledger only flags that an
      // enrollment happened, not whose.

      return `
      <li class="link ${r.tamper ? "tamper" : ""} ${failed ? "fail" : ""}">
        <div class="link-top">
          <span class="etype">${r.event_type}
            <span class="tag ${r.tamper ? "tamper" : "bump"}">${r.tamper ? "TAMPER" : "normal"}</span>
            ${r.enrolledUser ? '<span class="tag enroll">ENROLLMENT</span>' : ""}
            ${failed ? '<span class="tag fail">VERIFY FAILED</span>' : ""}
            ${checked ? '<span class="tag ok">VERIFIED</span>' : ""}
          </span>
          <span class="time">${formatIST(r.timestamp)}</span>
        </div>
        <div class="hash-row">
          <div class="hash-block">
            <span class="hash-label">SHA-256 hash</span>
            <span class="hash-value">${fullHash(r.hash)}</span>
          </div>
          <span class="anchor ${r.anchor}">${anchorLabel}</span>
        </div>
        ${geoRow}
      </li>`;
    }).join("");
  }

  // ---- actions ------------------------------------------------------------
  async function verifyChain() {
    const v = document.getElementById("verdict");
    try {
      const rows = await api("/events");
      const records = normalise(rows).slice(0, 25); // most recent 25, keeps this snappy
      v.className = "verdict"; v.textContent = `Verifying ${records.length} record(s)…`;
      const results = await Promise.all(records.map(r => api(`/events/${r.id}/verify`)));
      verifyResults = new Map(results.map(res => [res.id, res]));
      renderChain(records);
      const failedOnes = results.filter(res => res.dbMatch === false || res.chainMatch === false);
      if (failedOnes.length === 0) {
        v.className = "verdict ok";
        v.textContent = `✓ ${records.length} record(s) verified — recomputed hashes match, no tampering detected.`;
      } else {
        v.className = "verdict bad";
        v.textContent = `✗ Verification FAILED on record #${failedOnes.map(f => f.id).join(", #")}.`;
      }
    } catch {
      const broken = mockChain.findIndex(r => r.tamper);
      if (broken === -1) { v.className = "verdict ok"; v.textContent = `✓ Chain intact — ${mockChain.length} records (demo mode).`; }
      else { v.className = "verdict bad"; v.textContent = `✗ Record #${broken} flagged tamper (demo mode).`; }
    }
  }

  refresh();
  setInterval(refresh, 5000);   // live poll every 5s
</script>
</body>
</html>
