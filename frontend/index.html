<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti Tamper Vault</title>
<script>
  // Applied before first paint (and before React mounts) so there's no
  // flash of the wrong theme. Falls back to the OS preference if the
  // visitor hasn't picked one yet.
  (function () {
    const saved = localStorage.getItem("theme");
    const theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
